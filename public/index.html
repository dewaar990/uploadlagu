<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07060d">
  <title>DeeRiZ Corp Studios</title>
  <meta name="description" content="Jasa scripting & optimasi sistem Roblox, plus upload lagu speed 2x otomatis ke Roblox. Hubungi @deerizinhere di Discord.">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">
      <span class="brand-logo">DRZ<small>STUDIOS</small></span>
      <span class="brand-name">DeeRiZ Corp<span>STUDIOS</span></span>
    </a>
    <div class="lang"><button data-lang="id">ID</button><button data-lang="en">EN</button></div>
    <a class="btn btn-primary" id="navCta" href="/login" data-i18n="nav.login">Masuk</a>
  </header>

  <main>
    <section class="hero">
      <h1 class="glow-title" data-i18n="hero.title">Konversi &amp; Upload Audio ke Roblox</h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="hero-actions">
        <a class="btn btn-primary btn-lg" href="/app">
          <span data-i18n="hero.start">Mulai Sekarang</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a class="btn btn-ghost btn-lg" href="#cara-pembelian" data-i18n="hero.how">Cara Pembelian</a>
      </div>
    </section>

    <section class="section" id="layanan">
      <h2 data-i18n="svc.title">Layanan</h2>
      <p class="sub" data-i18n="svc.sub"></p>
      <div class="steps">
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><h3 data-i18n="svc.1.t"></h3><p data-i18n="svc.1.d"></p></div>
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg></span><h3 data-i18n="svc.2.t"></h3><p data-i18n="svc.2.d"></p></div>
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></span><h3 data-i18n="svc.3.t"></h3><p data-i18n="svc.3.d"></p></div>
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l1.9 1.9M16 2l-1.9 1.9"/><rect x="7" y="6" width="10" height="14" rx="5"/><path d="M3 13h4M17 13h4M4 7l3 2M20 7l-3 2M4 19l3-2M20 19l-3-2"/></svg></span><h3 data-i18n="svc.4.t"></h3><p data-i18n="svc.4.d"></p></div>
      </div>
    </section>

    <section class="section" id="keamanan" style="padding-top:0">
      <h2 data-i18n="sec.title">Keamanan Data &amp; Aset</h2>
      <p class="sub" data-i18n="sec.sub"></p>
      <div class="steps steps-3">
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14 9l2 2"/></svg></span><h3 data-i18n="sec.1.t"></h3><p data-i18n="sec.1.d"></p></div>
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><path d="m3 3 18 18"/></svg></span><h3 data-i18n="sec.2.t"></h3><p data-i18n="sec.2.d"></p></div>
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="m17 11 2 2 4-4"/></svg></span><h3 data-i18n="sec.3.t"></h3><p data-i18n="sec.3.d"></p></div>
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span><h3 data-i18n="sec.4.t"></h3><p data-i18n="sec.4.d"></p></div>
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span><h3 data-i18n="sec.5.t"></h3><p data-i18n="sec.5.d"></p></div>
        <div class="step-card"><span class="feat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><h3 data-i18n="sec.6.t"></h3><p data-i18n="sec.6.d"></p></div>
      </div>
    </section>

    <section class="section" id="cara-pembelian" style="padding-top:0">
      <h2 data-i18n="buy.title">Cara Pembelian</h2>
      <p class="sub" data-i18n="buy.sub"></p>
      <div class="steps">
        <div class="step-card"><div class="num">01</div><h3 data-i18n="buy.1.t"></h3><p data-i18n="buy.1.d"></p></div>
        <div class="step-card"><div class="num">02</div><h3 data-i18n="buy.2.t"></h3><p data-i18n="buy.2.d"></p></div>
        <div class="step-card"><div class="num">03</div><h3 data-i18n="buy.3.t"></h3><p data-i18n="buy.3.d"></p></div>
        <div class="step-card"><div class="num">04</div><h3 data-i18n="buy.4.t"></h3><p data-i18n="buy.4.d"></p></div>
      </div>

      <div class="card discord-card">
        <div class="discord-badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.32 4.37A19.8 19.8 0 0 0 15.4 2.8a.07.07 0 0 0-.08.04c-.21.38-.45.87-.61 1.25a18.3 18.3 0 0 0-5.48 0 12.6 12.6 0 0 0-.62-1.25.08.08 0 0 0-.08-.04 19.7 19.7 0 0 0-4.92 1.57.07.07 0 0 0-.03.03C.53 9.05-.32 13.58.1 18.06a.08.08 0 0 0 .03.06 19.9 19.9 0 0 0 6 3.03.08.08 0 0 0 .08-.03c.46-.63.87-1.3 1.23-2a.08.08 0 0 0-.04-.11 13.1 13.1 0 0 1-1.87-.9.08.08 0 0 1-.01-.13l.37-.29a.07.07 0 0 1 .08-.01c3.93 1.8 8.18 1.8 12.07 0a.07.07 0 0 1 .08.01l.37.29a.08.08 0 0 1 0 .13c-.6.35-1.22.65-1.88.9a.08.08 0 0 0-.04.1c.36.7.78 1.37 1.23 2a.08.08 0 0 0 .08.03 19.8 19.8 0 0 0 6.03-3.03.08.08 0 0 0 .03-.06c.5-5.18-.84-9.67-3.55-13.66a.06.06 0 0 0-.03-.03ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.34-.96 2.42-2.16 2.42Zm7.97 0c-1.18 0-2.15-1.08-2.15-2.42 0-1.33.95-2.42 2.15-2.42 1.22 0 2.18 1.1 2.16 2.42 0 1.34-.94 2.42-2.16 2.42Z"/></svg></div>
        <div class="discord-text">
          <div class="small" data-i18n="buy.contact">Hubungi di Discord</div>
          <div class="discord-user">@<span class="js-discord-user">deerizinhere</span></div>
        </div>
        <div class="row discord-actions">
          <a class="btn btn-primary js-discord-open" href="https://discord.com/app" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.32 4.37A19.8 19.8 0 0 0 15.4 2.8a.07.07 0 0 0-.08.04c-.21.38-.45.87-.61 1.25a18.3 18.3 0 0 0-5.48 0 12.6 12.6 0 0 0-.62-1.25.08.08 0 0 0-.08-.04 19.7 19.7 0 0 0-4.92 1.57.07.07 0 0 0-.03.03C.53 9.05-.32 13.58.1 18.06a.08.08 0 0 0 .03.06 19.9 19.9 0 0 0 6 3.03.08.08 0 0 0 .08-.03c.46-.63.87-1.3 1.23-2a.08.08 0 0 0-.04-.11 13.1 13.1 0 0 1-1.87-.9.08.08 0 0 1-.01-.13l.37-.29a.07.07 0 0 1 .08-.01c3.93 1.8 8.18 1.8 12.07 0a.07.07 0 0 1 .08.01l.37.29a.08.08 0 0 1 0 .13c-.6.35-1.22.65-1.88.9a.08.08 0 0 0-.04.1c.36.7.78 1.37 1.23 2a.08.08 0 0 0 .08.03 19.8 19.8 0 0 0 6.03-3.03.08.08 0 0 0 .03-.06c.5-5.18-.84-9.67-3.55-13.66a.06.06 0 0 0-.03-.03ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.34-.96 2.42-2.16 2.42Zm7.97 0c-1.18 0-2.15-1.08-2.15-2.42 0-1.33.95-2.42 2.15-2.42 1.22 0 2.18 1.1 2.16 2.42 0 1.34-.94 2.42-2.16 2.42Z"/></svg><span data-i18n="buy.open">Buka Discord</span></a>
          <button class="btn btn-ghost js-discord-copy" type="button" data-i18n="buy.copy">Salin username</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">© <span id="year"></span> DeeRiZ Corp Studios</footer>

  <script src="/js/common.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    // Kontak Discord (bisa diubah lewat env DISCORD_USERNAME / DISCORD_URL)
    fetch('/api/public-config').then((r) => r.json()).then((c) => {
      document.querySelectorAll('.js-discord-user').forEach((el) => { el.textContent = c.discordUsername; });
      if (c.discordUrl) document.querySelectorAll('.js-discord-open').forEach((a) => { a.href = c.discordUrl; });
      window.DISCORD = c;
    }).catch(() => {});
    document.querySelectorAll('.js-discord-copy').forEach((b) => b.addEventListener('click', () => {
      copyText(window.DISCORD?.discordUsername || 'deerizinhere');
    }));
    // Membuka Discord tanpa link profil: salin username dulu agar mudah dicari
    document.querySelectorAll('.js-discord-open').forEach((a) => a.addEventListener('click', () => {
      if (!window.DISCORD?.discordUrl) copyText(window.DISCORD?.discordUsername || 'deerizinhere');
    }));
    // Jika sudah login, tombol header langsung ke dashboard
    fetch('/api/me').then((r) => (r.ok ? r.json() : null)).then((me) => {
      if (!me) return;
      const a = document.getElementById('navCta');
      a.href = me.role === 'admin' ? '/admin' : '/app';
      a.dataset.i18n = me.role === 'admin' ? 'nav.admin' : 'nav.dashboard';
      applyI18n();
    }).catch(() => {});
  </script>
</body>
</html>
