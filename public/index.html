<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07060d">
  <title>DeeRiZ Corp Studios</title>
  <meta name="description" content="Konversi lagu speed 2x, upload ke Roblox, cek moderasi, dan simpan SoundId ke DataStore otomatis.">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">
      <span class="brand-logo">DRZ<small>STUDIOS</small></span>
      <span class="brand-name">DeeRiZ Corp<span>STUDIOS</span></span>
    </a>
    <div class="lang"><button data-lang="id">ID</button><button data-lang="en">EN</button></div>
    <a class="btn btn-primary" id="navCta" href="/login" data-i18n="nav.login">Masuk</a>
  </header>

  <main>
    <section class="hero">
      <h1 class="glow-title" data-i18n="hero.title">Konversi &amp; Upload Audio ke Roblox</h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="hero-actions">
        <a class="btn btn-primary btn-lg" href="/app">
          <span data-i18n="hero.start">Mulai Sekarang</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a class="btn btn-ghost btn-lg" href="#cara-kerja" data-i18n="hero.how">Cara Kerja</a>
      </div>
    </section>

    <section class="section" id="cara-kerja">
      <h2 data-i18n="how.title">Cara Kerja</h2>
      <p class="sub" data-i18n="how.sub"></p>
      <div class="steps">
        <div class="step-card"><div class="num">01</div><h3 data-i18n="how.1.t"></h3><p data-i18n="how.1.d"></p></div>
        <div class="step-card"><div class="num">02</div><h3 data-i18n="how.2.t"></h3><p data-i18n="how.2.d"></p></div>
        <div class="step-card"><div class="num">03</div><h3 data-i18n="how.3.t"></h3><p data-i18n="how.3.d"></p></div>
        <div class="step-card"><div class="num">04</div><h3 data-i18n="how.4.t"></h3><p data-i18n="how.4.d"></p></div>
        <div class="step-card"><div class="num">05</div><h3 data-i18n="how.5.t"></h3><p data-i18n="how.5.d"></p></div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="card" style="text-align:center">
        <h2 style="font-family:var(--display);text-transform:uppercase;font-size:22px" data-i18n="cta.title">Butuh akses?</h2>
        <p class="hint" style="max-width:560px;margin:10px auto 20px" data-i18n="cta.sub"></p>
        <a class="btn btn-primary" href="/login" data-i18n="nav.login">Masuk</a>
      </div>
    </section>
  </main>

  <footer class="footer">© <span id="year"></span> DeeRiZ Corp Studios</footer>

  <script src="/js/common.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    // Jika sudah login, tombol header langsung ke dashboard
    fetch('/api/me').then((r) => (r.ok ? r.json() : null)).then((me) => {
      if (!me) return;
      const a = document.getElementById('navCta');
      a.href = me.role === 'admin' ? '/admin' : '/app';
      a.dataset.i18n = me.role === 'admin' ? 'nav.admin' : 'nav.dashboard';
      applyI18n();
    }).catch(() => {});
  </script>
</body>
</html>
